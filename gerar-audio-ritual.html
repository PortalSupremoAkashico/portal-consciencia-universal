<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Gerar Áudios do Ritual</title>
  <style>
    body{font-family:sans-serif;background:#05030f;color:#ede9ff;padding:40px 20px;max-width:520px;margin:0 auto;}
    h2{color:#f0c96b;margin-bottom:8px;}
    p{font-size:.83rem;color:rgba(196,181,253,.6);margin-bottom:24px;line-height:1.6;}
    .item{display:flex;align-items:center;gap:12px;margin:10px 0;padding:12px 14px;border:1px solid rgba(240,201,107,.15);border-radius:10px;}
    .num{color:rgba(240,201,107,.5);font-size:.8rem;width:18px;flex-shrink:0;}
    .txt{flex:1;font-size:.82rem;color:rgba(196,181,253,.8);line-height:1.4;}
    .st{font-size:.75rem;min-width:90px;text-align:right;}
    .st.ok{color:#6ee7b7;}
    .st.err{color:#f87171;}
    .st.load{color:rgba(240,201,107,.6);}
    button{margin-top:24px;padding:12px 32px;background:rgba(240,201,107,.1);border:1.5px solid rgba(240,201,107,.7);border-radius:20px;color:#f0c96b;font-size:.9rem;cursor:pointer;width:100%;}
    button:hover{background:rgba(240,201,107,.2);}
    button:disabled{opacity:.4;cursor:not-allowed;}
    .info{margin-top:24px;font-size:.76rem;color:rgba(196,181,253,.35);line-height:1.8;border-top:1px solid rgba(196,181,253,.1);padding-top:16px;}
    code{color:#f0c96b;}
  </style>
</head>
<body>
  <h2>⬇ Gerador de Áudios do Ritual</h2>
  <p>Clique em Gerar — os 5 arquivos MP3 serão baixados automaticamente para a sua pasta de downloads.</p>

  <div id="lista"></div>

  <button id="btnGerar" onclick="gerarTodos()">▶ Gerar e baixar os 5 MP3s</button>

  <div class="info">
    Após o download, suba os arquivos ao GitHub na pasta <code>/audio/</code>:<br>
    <code>ritual-1.mp3</code> &nbsp;·&nbsp;
    <code>ritual-2.mp3</code> &nbsp;·&nbsp;
    <code>ritual-3.mp3</code><br>
    <code>ritual-4.mp3</code> &nbsp;·&nbsp;
    <code>ritual-5.mp3</code>
  </div>

  <script>
    var FRASES = [
      'Bem-vindo ao Portal da Consciência Universal.',
      'Siga a sequência para entrar em alinhamento antes de abrir a consulta.',
      'Sente-se com a coluna ereta e desacelere a respiração.',
      'Mentalize proteção, verdade e discernimento.',
      'Respire profundo e solte por 3 vezes, liberando tensões.',
      'Quando se sentir pronto... abra a sua consulta.'
    ];

    var lista = document.getElementById('lista');
    FRASES.forEach(function(txt,i){
      var div = document.createElement('div');
      div.className = 'item';
      div.innerHTML =
        '<span class="num">'+(i+1)+'</span>'+
        '<span class="txt">'+txt+'</span>'+
        '<span class="st" id="st-'+(i+1)+'">aguardando</span>';
      lista.appendChild(div);
    });

    async function gerarTodos(){
      var btn = document.getElementById('btnGerar');
      btn.disabled = true;
      btn.textContent = '⏳ Gerando...';

      for(var i = 0; i < FRASES.length; i++){
        var n = i + 1;
        var st = document.getElementById('st-'+n);
        st.className = 'st load';
        st.textContent = '⏳ gerando...';

        try {
          var r = await fetch('/api/tts', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ text: FRASES[i], speed: 0.72 })
          });
          if(!r.ok) throw new Error('status '+r.status);

          var blob = await r.blob();

          // Download automático
          var url = URL.createObjectURL(blob);
          var a   = document.createElement('a');
          a.href     = url;
          var nomes = ['bem-vindo','ritual-1','ritual-2','ritual-3','ritual-4','ritual-5'];
          a.download = nomes[i]+'.mp3';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);

          st.className = 'st ok';
          st.textContent = '✅ ritual-'+n+'.mp3';

          // Pequena pausa entre downloads para não bloquear o browser
          await new Promise(function(r){ setTimeout(r, 800); });

        } catch(e){
          st.className = 'st err';
          st.textContent = '❌ erro';
        }
      }

      btn.textContent = '✅ Concluído! Verifique sua pasta de downloads.';
    }
  </script>
</body>
</html>
