<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Geometria Sagrada com Frequências e Mantras — Portal da Consciência Universal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cormorant Garamond',serif;background:#020108;color:rgba(196,181,253,.85);min-height:100vh;overflow-x:hidden}
#universeCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 60px}

/* NAV */
nav{width:100%;max-width:700px;padding:18px 0 0;display:flex;align-items:center;gap:12px}
.nav-back{font-family:'Cinzel',serif;font-size:.95rem;letter-spacing:.1em;color:rgba(196,181,253,.5);cursor:pointer;text-decoration:none;transition:color .2s}
.nav-back:hover{color:rgba(196,181,253,.9)}
.nav-sep{color:rgba(196,181,253,.2);font-size:.95rem}
.nav-current{font-family:'Cinzel',serif;font-size:.95rem;letter-spacing:.1em;color:rgba(240,201,107,.7)}

/* HEADER */
.page-title{font-family:'Cinzel',serif;font-size:1.4rem;letter-spacing:.14em;color:rgba(240,201,107,.9);text-shadow:0 0 30px rgba(240,201,107,.3);text-align:center}
.page-sub{font-size:1.15rem;color:rgba(196,181,253,.65);margin:10px 0 30px;letter-spacing:.05em;text-align:center}

/* HEADER ROW */
.header-row{display:flex;align-items:center;justify-content:center;position:relative;width:100%;max-width:820px;margin:24px 0 8px}
.back-btn{
  position:absolute;left:0;
  display:inline-flex;align-items:center;gap:7px;
  font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.12em;
  color:rgba(196,181,253,.65);cursor:pointer;text-decoration:none;
  background:transparent;
  border:1px solid rgba(196,181,253,.3);
  border-radius:22px;padding:7px 18px;
  transition:all .22s ease;white-space:nowrap;
}
.back-btn:hover{
  border-color:rgba(196,181,253,.75);
  color:rgba(196,181,253,.95);
  box-shadow:0 0 14px rgba(196,181,253,.2);
}

/* FORM */
#formView{width:100%;max-width:600px}
.field{margin-bottom:22px}
.field label{display:block;font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.1em;color:rgba(240,201,107,.7);margin-bottom:10px;text-align:center}
.field textarea,.field input[type=text]{width:100%;background:rgba(4,2,14,.82);border:1px solid rgba(196,181,253,.22);border-radius:12px;padding:14px 16px;color:rgba(210,200,255,.92);font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.7;resize:vertical;outline:none;transition:border-color .2s;backdrop-filter:blur(4px)}
.field textarea:focus,.field input[type=text]:focus{border-color:rgba(240,201,107,.4)}
.field textarea{min-height:90px}

.timer-row{display:flex;gap:10px;margin-bottom:22px}
.timer-btn{flex:1;padding:10px;background:rgba(4,2,14,.78);border:1px solid rgba(196,181,253,.22);border-radius:10px;color:rgba(196,181,253,.65);font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.08em;cursor:pointer;transition:all .2s}
.timer-btn.active,.timer-btn:hover{background:rgba(240,201,107,.15);border-color:rgba(240,201,107,.4);color:rgba(240,201,107,.9)}

.binaural-row{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:12px 16px;background:rgba(4,2,14,.75);border:1px solid rgba(196,181,253,.12);border-radius:10px;cursor:pointer;user-select:none}
.binaural-row input{accent-color:#f0c96b;width:16px;height:16px;cursor:pointer}
.binaural-label{font-size:1.05rem;color:rgba(196,181,253,.7);line-height:1.4}
.binaural-hint{font-size:.9rem;color:rgba(196,181,253,.4);margin-top:2px}

.btn-main{width:100%;padding:16px;background:rgba(4,2,14,.82);border:1px solid rgba(240,201,107,.45);border-radius:14px;color:#f0c96b;font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.12em;cursor:pointer;transition:all .25s;box-shadow:0 0 20px rgba(240,201,107,.08)}
.btn-main:hover:not(:disabled){background:linear-gradient(135deg,rgba(240,201,107,.35),rgba(240,201,107,.15));box-shadow:0 0 30px rgba(240,201,107,.2)}
.btn-main:disabled{opacity:.5;cursor:not-allowed}

/* SESSION */
#sessionView{width:100%;max-width:820px;display:none;flex-direction:column;align-items:center}

.freq-display{text-align:center;margin:24px 0 20px}
.freq-hz{font-family:'Cinzel',serif;font-size:2.2rem;font-weight:400;color:rgba(240,201,107,.75);text-shadow:0 0 20px rgba(240,201,107,.3);line-height:1;letter-spacing:.1em}
.freq-unit{font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.2em;color:rgba(240,201,107,.45);margin-left:3px}
.freq-nome{font-family:'Cinzel',serif;font-size:1.1rem;letter-spacing:.15em;color:rgba(240,201,107,.7);margin-top:8px;text-transform:uppercase}
.geo-nome{font-size:1rem;letter-spacing:.1em;color:rgba(196,181,253,.5);margin-top:4px;font-style:italic}

/* GEOMETRY IMAGE */
#geoWrap{position:relative;width:min(78vmin,560px);height:min(78vmin,560px);margin:8px 0}
#geoCanvas{width:100%;height:100%;
  filter:drop-shadow(0 0 40px rgba(240,201,107,.45)) drop-shadow(0 0 90px rgba(180,60,255,.25));
  animation:geoBreath 4s ease-in-out infinite;}

/* CONTROLS */
.controls{display:flex;align-items:center;gap:16px;margin:20px 0}
.btn-play{padding:12px 32px;background:rgba(240,201,107,.15);border:1px solid rgba(240,201,107,.4);border-radius:30px;color:#f0c96b;font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
.btn-play:hover{background:rgba(240,201,107,.25);box-shadow:0 0 16px rgba(240,201,107,.3)}
.btn-play.playing{background:rgba(240,100,100,.2);border-color:rgba(240,100,100,.4);color:rgba(240,160,160,.9)}
.timer-display{font-family:'Cinzel',serif;font-size:2.2rem;color:rgba(240,201,107,.8);min-width:80px;text-align:center}

/* READING CARD */
.reading{width:100%;max-width:780px;margin-top:36px}
.read-card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),
  rgba(14,10,30,.85);
  border:1px solid rgba(196,181,253,.18);
  border-radius:20px;
  padding:36px 40px;
  margin-bottom:20px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 40px rgba(0,0,0,.4),0 0 0 1px rgba(196,181,253,.06);
  position:relative;overflow:hidden;
}
.read-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.03) 40%,transparent 70%);
  pointer-events:none;
}
.read-label{
  font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:.22em;
  color:rgba(240,201,107,.65);margin-bottom:20px;text-transform:uppercase;
  text-align:center;width:100%;
}
.read-text{
  font-family:'Cormorant Garamond',serif;
  font-size:1.35rem;line-height:2.05;
  color:rgba(220,210,255,.9);
}
.read-text p{margin-bottom:18px}
.read-text p:last-child{margin-bottom:0}

.geo-significado{
  width:100%;max-width:640px;
  font-family:'Cormorant Garamond',serif;
  font-size:1.15rem;line-height:1.9;
  color:rgba(196,181,253,.72);
  text-align:center;
  padding:20px 28px;
  margin-top:16px;
}
.btn-nova{margin-top:20px;padding:11px 28px;background:transparent;border:1px solid rgba(196,181,253,.25);border-radius:24px;color:rgba(196,181,253,.55);font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
.btn-nova:hover{border-color:rgba(196,181,253,.5);color:rgba(196,181,253,.85)}

/* SPINNER */
.spinner{display:none;text-align:center;padding:40px 0}
.spin-ring{width:48px;height:48px;border:2px solid rgba(240,201,107,.15);border-top-color:rgba(240,201,107,.7);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-text{font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.12em;color:rgba(240,201,107,.6)}

@keyframes geoBreath{0%,100%{opacity:.82;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
@keyframes geoGlow{0%,100%{filter:drop-shadow(0 0 14px rgba(240,201,107,.25))}50%{filter:drop-shadow(0 0 36px rgba(240,201,107,.6))}}
.geo-breath{animation:geoBreath 4s ease-in-out infinite,geoGlow 4s ease-in-out infinite}

@media(max-width:600px){.freq-hz{font-size:1.6rem}#geoWrap{width:min(88vmin,340px);height:min(88vmin,340px)}.geo-significado{font-size:1rem;padding:14px 16px}}
</style>
</head>
<body>
<canvas id="universeCanvas"></canvas>
<div class="wrap">
  <div style="width:100%;max-width:820px;margin:24px 0 0;display:flex;align-items:flex-start">
    <a class="back-btn" role="button" tabindex="0" onclick="window.location.href='/perfil'" onkeydown="if(event.key==='Enter')window.location.href='/perfil'">
      <svg width="14" height="14" viewBox="-26 -20 52 40"><path d="M8,-14 L-12,0 L8,14" fill="none" stroke="rgba(196,181,253,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="-12" y1="0" x2="14" y2="0" stroke="rgba(196,181,253,0.65)" stroke-width="1.5" stroke-linecap="round"/></svg>
      Voltar
    </a>
  </div>
  <div class="page-title" style="margin-top:18px">GEOMETRIA SAGRADA COM FREQUÊNCIAS E MANTRAS</div>
  <div class="page-sub">Sintonize a frequência e a geometria sagrada do seu momento</div>

  <!-- FORM -->
  <div id="formView">
    <div class="field">
      <label>O QUE VOCÊ ESTÁ VIVENDO AGORA</label>
      <textarea id="estado" placeholder="Descreva o que está sentindo, atravessando ou buscando neste momento..."></textarea>
    </div>
    <div class="field">
      <label>INTENÇÃO PARA ESTA SESSÃO (opcional)</label>
      <textarea id="intencao" placeholder="O que você quer curar, liberar, expandir ou integrar..." style="min-height:70px"></textarea>
    </div>
    <div style="font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.1em;color:rgba(240,201,107,.7);margin-bottom:12px;text-align:center;width:100%">DURAÇÃO DA SESSÃO</div>
    <div class="timer-row">
      <button class="timer-btn" data-min="10">10 min</button>
      <button class="timer-btn active" data-min="20">20 min</button>
      <button class="timer-btn" data-min="30">30 min</button>
    </div>
    <label class="binaural-row" for="binaural">
      <input type="checkbox" id="binaural">
      <div>
        <div class="binaural-label">Ativar Batida Binaural</div>
        <div class="binaural-hint">O cérebro gera uma terceira frequência interna — use fones de ouvido</div>
      </div>
    </label>
    <button class="btn-main" id="btnIniciar" onclick="iniciarSessao()">✦ Sintonizar Frequência</button>
  </div>

  <!-- SPINNER -->
  <div class="spinner" id="spinner">
    <div class="spin-ring"></div>
    <div class="spin-text">A CONSCIÊNCIA ESTÁ SINTONIZANDO...</div>
  </div>

  <!-- SESSION -->
  <div id="sessionView">
    <div class="freq-display">
      <div><span id="freqHz" class="freq-hz">528</span><span class="freq-unit">Hz</span></div>
      <div class="freq-nome" id="freqNome">Amor e Milagres</div>
      <div class="geo-nome" id="geoNome">Flor da Vida</div>
    </div>

    <div id="geoWrap">
      <canvas id="geoCanvas"></canvas>
    </div>

    <div class="controls">
      <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶ Iniciar</button>
      <div class="timer-display" id="timerDisplay">20:00</div>
    </div>

    <div id="reading" style="display:none"></div>

    <div class="geo-significado" id="geoSignificado"></div>
    <button class="btn-nova" onclick="novaSessao()">Nova Sessão</button>
  </div>
</div>

<script>
// ── Fundo cósmico idêntico ao portal ──
(function(){
  const canvas=document.getElementById('universeCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let W,H,stars=[],nebulae=[],galaxies=[],spaceships=[],starClusters=[],t=0,paused=false;
  function rand(a,b){return a+Math.random()*(b-a);}
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;init();}
  function init(){
    stars=[];
    const n=Math.floor((W*H)/1200);
    for(let i=0;i<n;i++){const spd=rand(0.2,1.4);const bright=i<Math.floor(n*0.012);stars.push({x:rand(0,W),y:rand(0,H),r:bright?rand(1.5,2.8):rand(0.3,1.4),alpha:rand(0.4,1),speed:rand(0.0003,0.0012),phase:rand(0,Math.PI*2),color:Math.random()<0.18?`hsl(${rand(190,290)},85%,90%)`:'#fff',dx:spd*0.7,dy:spd*0.18,isBright:bright});}
    nebulae=[];
    const cols=[[120,70,200],[60,100,255],[200,80,160],[30,120,220],[160,60,220],[80,160,255]];
    for(let i=0;i<10;i++){const[r,g,b]=cols[i%cols.length];nebulae.push({x:rand(0,W),y:rand(0,H),rx:rand(W*.18,W*.48),ry:rand(H*.13,H*.38),alpha:rand(0.06,0.16),angle:rand(0,Math.PI),r,g,b,driftX:rand(-0.04,0.04),driftY:rand(-0.025,0.025),rotSpeed:rand(-0.00006,0.00006),pulseSpeed:rand(0.0002,0.0009),pulsePhase:rand(0,Math.PI*2)});}
    galaxies=[];
    for(let i=0;i<6;i++){galaxies.push({x:rand(0,W),y:rand(0,H),r:rand(18,55),angle:rand(0,Math.PI*2),alpha:rand(0.04,0.12),rotSpeed:rand(-0.0003,0.0003),col:[rand(100,200),rand(80,160),rand(200,255)]});}
    starClusters=[];
    for(let i=0;i<8;i++){const cx=rand(0,W),cy=rand(0,H),cr=rand(30,90);const pts=[];for(let j=0;j<rand(8,20);j++)pts.push({ox:rand(-cr,cr),oy:rand(-cr,cr),r:rand(0.5,2.5),a:rand(0.3,1)});starClusters.push({cx,cy,pts,dx:rand(-0.08,0.08),dy:rand(-0.04,0.04)});}
    spaceships=[];
  }
  function drawGalaxy(g){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.angle);const gr=ctx.createRadialGradient(0,0,0,0,0,g.r);gr.addColorStop(0,`rgba(${g.col[0]},${g.col[1]},${g.col[2]},${g.alpha*1.2})`);gr.addColorStop(0.4,`rgba(${g.col[0]},${g.col[1]},${g.col[2]},${g.alpha*0.5})`);gr.addColorStop(1,`rgba(${g.col[0]},${g.col[1]},${g.col[2]},0)`);ctx.scale(1,0.35);ctx.beginPath();ctx.arc(0,0,g.r,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();ctx.restore();g.angle+=g.rotSpeed;}
  function criarNave(){
    if(Math.random()<0.004&&spaceships.length<2){
      const dir=Math.random()<0.5?1:-1;
      spaceships.push({x:dir>0?-50:W+50,y:rand(H*.1,H*.85),size:rand(8,14),speed:rand(14,24)*dir,lightPhase:rand(0,Math.PI*2),lightSpeed:rand(0.18,0.32),col:Math.random()<0.5?[100,200,255]:[200,100,255],trail:[]});
    }
  }
  function drawShip(s){
    // Rastro
    s.trail.push({x:s.x,y:s.y,a:1});
    if(s.trail.length>15)s.trail.shift();
    s.trail.forEach((p,i)=>{
      const a=(i/s.trail.length)*p.a,sz=s.size*0.3*(i/s.trail.length);
      ctx.save();ctx.globalAlpha=a*0.6;ctx.shadowBlur=14;ctx.shadowColor=`rgba(${s.col[0]},${s.col[1]},${s.col[2]},${a})`;
      const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,sz*3);
      gr.addColorStop(0,`rgba(255,255,255,${a*.8})`);gr.addColorStop(0.5,`rgba(${s.col[0]},${s.col[1]},${s.col[2]},${a*.6})`);gr.addColorStop(1,`rgba(${s.col[0]},${s.col[1]},${s.col[2]},0)`);
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,sz*3,0,Math.PI*2);ctx.fill();ctx.restore();
      p.a*=0.95;
    });
    // Corpo
    ctx.save();ctx.translate(s.x,s.y);
    ctx.shadowBlur=12;ctx.shadowColor=`rgba(${s.col[0]},${s.col[1]},${s.col[2]},0.8)`;
    ctx.fillStyle=`rgba(${s.col[0]},${s.col[1]},${s.col[2]},0.9)`;
    ctx.beginPath();ctx.ellipse(0,-s.size*.15,s.size*.5,s.size*.25,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(${s.col[0]-30},${s.col[1]-30},${s.col[2]-30},0.8)`;
    ctx.beginPath();ctx.ellipse(0,0,s.size*.8,s.size*.3,0,0,Math.PI*2);ctx.fill();
    const blink=Math.sin(s.lightPhase)*.5+.5;
    ctx.fillStyle=`rgba(255,255,200,${blink})`;ctx.shadowBlur=8;ctx.shadowColor=`rgba(255,255,200,${blink})`;
    ctx.beginPath();ctx.arc(0,0,s.size*.15,0,Math.PI*2);ctx.fill();
    ctx.restore();
    s.x+=s.speed;s.lightPhase+=s.lightSpeed;
    if(s.x<-100||s.x>W+100)spaceships.splice(spaceships.indexOf(s),1);
  }
  function loop(ts){
    if(paused){requestAnimationFrame(loop);return;}
    t=ts;ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(W*.5,H*.4,0,W*.5,H*.5,Math.max(W,H)*.85);
    bg.addColorStop(0,'#0d0820');bg.addColorStop(0.35,'#060314');bg.addColorStop(1,'#020108');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    nebulae.forEach(n=>{const pulse=Math.sin(t*n.pulseSpeed+n.pulsePhase)*0.4+0.8;ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.angle);const g=ctx.createRadialGradient(0,0,0,0,0,n.rx),a=n.alpha*pulse;g.addColorStop(0,`rgba(${n.r},${n.g},${n.b},${a})`);g.addColorStop(1,`rgba(${n.r},${n.g},${n.b},0)`);ctx.scale(1,n.ry/n.rx);ctx.beginPath();ctx.arc(0,0,n.rx,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.restore();n.x+=n.driftX;n.y+=n.driftY;n.angle+=n.rotSpeed;});
    galaxies.forEach(g=>drawGalaxy(g));
    starClusters.forEach(c=>{c.cx+=c.dx;c.cy+=c.dy;if(c.cx<-100)c.cx=W+100;if(c.cx>W+100)c.cx=-100;if(c.cy<-100)c.cy=H+100;if(c.cy>H+100)c.cy=-100;c.pts.forEach(p=>{ctx.beginPath();ctx.arc(c.cx+p.ox,c.cy+p.oy,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${p.a*0.7})`;ctx.fill();});});
    stars.forEach(s=>{s.x+=s.dx;s.y+=s.dy;if(s.x>W+4)s.x=-4;if(s.x<-4)s.x=W+4;if(s.y>H+4)s.y=-4;if(s.y<-4)s.y=H+4;const fl=Math.sin(t*s.speed*800+s.phase)*0.35+0.65;if(s.isBright){const g2=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*3.5);g2.addColorStop(0,'rgba(255,255,255,0.45)');g2.addColorStop(1,'rgba(255,255,255,0)');ctx.beginPath();ctx.arc(s.x,s.y,s.r*3.5,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();ctx.shadowBlur=20;ctx.shadowColor='rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.globalAlpha=1;ctx.fill();ctx.shadowBlur=0;}else{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=s.color;ctx.globalAlpha=s.alpha*fl;ctx.fill();ctx.globalAlpha=1;}});
    criarNave();spaceships.forEach(s=>drawShip(s));
    const v=ctx.createRadialGradient(W*.5,H*.5,H*.18,W*.5,H*.5,Math.max(W,H)*.78);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(2,1,8,0.7)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange',()=>{paused=document.hidden;});
  window.addEventListener('resize',resize);
  resize();requestAnimationFrame(loop);
})();

// ── Auth ──
var _user = null;
(function(){
  try{_user=JSON.parse(localStorage.getItem('akashic_user')||sessionStorage.getItem('akashic_user')||'null');}catch(e){}
  if(!_user||!_user.email){window.location.href='/login';return;}
})();

// ── Timer selection ──
var _durMin = 20;
document.querySelectorAll('.timer-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.timer-btn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    _durMin = parseInt(b.dataset.min);
    updateTimerDisplay(_durMin*60);
  });
});
function updateTimerDisplay(secs){
  var m=Math.floor(secs/60),s=secs%60;
  document.getElementById('timerDisplay').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
updateTimerDisplay(_durMin*60);

// ── Áudio — Síntese de Taça Tibetana ──
// Harmônicos inarmônicos reais de bowl tibetano, reverb por delay realimentado,
// drone suave contínuo com LFO, golpes periódicos automáticos.
var _audioCtx=null,_masterGain=null,_oscs=[],_playing=false;
var _timerInt=null,_timerSecs=0,_strikeTimers=[];

// Razões de parciais de uma taça de cristal/tibetana (não são múltiplos inteiros)
var BOWL_PARTIALS=[
  {ratio:1,     amp:.50, decay:9.0},
  {ratio:2.756, amp:.28, decay:5.5},
  {ratio:5.404, amp:.14, decay:3.0},
  {ratio:8.933, amp:.07, decay:1.8}
];

function _criarReverb(ctx){
  var delay=ctx.createDelay(2.0);
  delay.delayTime.setValueAtTime(0.38,ctx.currentTime);
  var fb=ctx.createGain(); fb.gain.setValueAtTime(0.38,ctx.currentTime);
  var cut=ctx.createBiquadFilter(); cut.type='lowpass'; cut.frequency.setValueAtTime(2400,ctx.currentTime);
  delay.connect(cut); cut.connect(fb); fb.connect(delay);
  return delay; // entrada e saída = mesmo nó
}

function _golpe(ctx,freqHz,masterGain,reverb,binaural,binauralOffset){
  var t=ctx.currentTime+0.01;
  BOWL_PARTIALS.forEach(function(p){
    var f=freqHz*p.ratio;
    if(binaural){
      // Canal esquerdo: freq normal, direito: freq+offset binaural
      var merger=ctx.createChannelMerger(2);merger.connect(masterGain);merger.connect(reverb);
      [0,1].forEach(function(ch){
        var osc=ctx.createOscillator(); osc.type='sine';
        osc.frequency.setValueAtTime(f+(ch===1?binauralOffset:0),t);
        var g=ctx.createGain();
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(p.amp*0.55,t+0.012);
        g.gain.setTargetAtTime(0.0001,t+0.012,p.decay*0.38);
        osc.connect(g); g.connect(merger,0,ch);
        osc.start(t); osc.stop(t+p.decay*2.5);
        _oscs.push(osc);
      });
    } else {
      var osc=ctx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(f,t);
      var g=ctx.createGain();
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(p.amp*0.55,t+0.012);
      g.gain.setTargetAtTime(0.0001,t+0.012,p.decay*0.38);
      osc.connect(g); g.connect(masterGain); g.connect(reverb);
      osc.start(t); osc.stop(t+p.decay*2.5);
      _oscs.push(osc);
    }
  });
}

function startAudio(freqHz,binaural){
  _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  _masterGain=_audioCtx.createGain();
  _masterGain.gain.setValueAtTime(0,_audioCtx.currentTime);
  _masterGain.gain.linearRampToValueAtTime(0.72,_audioCtx.currentTime+2.5);
  _masterGain.connect(_audioCtx.destination);

  // Reverb
  var reverb=_criarReverb(_audioCtx);
  var reverbOut=_audioCtx.createGain(); reverbOut.gain.setValueAtTime(0.45,_audioCtx.currentTime);
  reverb.connect(reverbOut); reverbOut.connect(_audioCtx.destination);

  // Offset binaural baseado na frequência (ondas cerebrais recomendadas)
  var binOffset=freqHz<400?4:freqHz<600?7:freqHz<800?10:8;

  // Drone contínuo muito suave (frequência base, volume baixo)
  var drone=_audioCtx.createOscillator(); drone.type='sine';
  drone.frequency.setValueAtTime(freqHz,_audioCtx.currentTime);
  var droneGain=_audioCtx.createGain(); droneGain.gain.setValueAtTime(0.045,_audioCtx.currentTime);
  // LFO suave no drone para respiração sonora
  var lfo=_audioCtx.createOscillator(); lfo.type='sine'; lfo.frequency.setValueAtTime(0.08,_audioCtx.currentTime);
  var lfoGain=_audioCtx.createGain(); lfoGain.gain.setValueAtTime(0.025,_audioCtx.currentTime);
  lfo.connect(lfoGain); lfoGain.connect(droneGain.gain);
  drone.connect(droneGain); droneGain.connect(_masterGain);
  drone.start(); lfo.start();
  _oscs.push(drone,lfo);

  // Primeiro golpe imediato
  _golpe(_audioCtx,freqHz,_masterGain,reverb,binaural,binOffset);

  // Golpes periódicos a cada ~11s
  var INTERVAL=11000;
  for(var i=1;i<=180;i++){
    (function(idx){
      var tid=setTimeout(function(){
        if(_playing&&_audioCtx) _golpe(_audioCtx,freqHz,_masterGain,reverb,binaural,binOffset);
      },idx*INTERVAL);
      _strikeTimers.push(tid);
    })(i);
  }
}

function stopAudio(){
  _strikeTimers.forEach(function(t){clearTimeout(t);}); _strikeTimers=[];
  if(_audioCtx){
    try{_masterGain.gain.setValueAtTime(_masterGain.gain.value,_audioCtx.currentTime);
    _masterGain.gain.linearRampToValueAtTime(0,_audioCtx.currentTime+2);}catch(e){}
    setTimeout(function(){
      _oscs.forEach(function(o){try{o.stop();}catch(e){}});_oscs=[];
      try{_audioCtx.close();}catch(e){}
      _audioCtx=null;_masterGain=null;
    },2100);
  }
}

function togglePlay(){
  var btn=document.getElementById('btnPlay');
  var audio=document.getElementById('mantraAudio');
  if(_playing){
    _playing=false;
    stopAudio();
    if(audio)audio.pause();
    if(_freqAudio){try{_freqAudio.pause();_freqAudio.src='';}catch(e){}  _freqAudio=null;}
    clearInterval(_timerInt);
    btn.textContent='▶ Retomar';btn.classList.remove('playing');
    var _gc=document.getElementById('geoCanvas');if(_gc)_gc.style.animationPlayState='paused';
  } else {
    _playing=true;
    // Toca mantra dos monges
    if(audio && audio.src && audio.src !== window.location.href){
      audio.volume=0.80;
      audio.play().catch(function(e){console.warn('[mantra]',e.message);});
    }
    // Toca frequência pré-gravada por baixo (zero custo API)
    var freqFile = FREQ_AUDIO[window._sessao.frequencia_hz];
    if(freqFile){
      _freqAudio = new Audio('/frequencias/'+freqFile);
      _freqAudio.loop = true;
      _freqAudio.volume = 0.45;
      _freqAudio.play().catch(function(e){
        // Fallback: Web Audio API se arquivo não existir ainda
        console.warn('[freq] arquivo não encontrado, usando síntese');
        startAudio(window._sessao.frequencia_hz, document.getElementById('binaural').checked);
      });
    } else {
      startAudio(window._sessao.frequencia_hz, document.getElementById('binaural').checked);
    }
    startTimer();
    btn.textContent='⏹ Parar';btn.classList.add('playing');
    var _gc2=document.getElementById('geoCanvas');if(_gc2)_gc2.style.animationPlayState='running';
  }
}

function startTimer(){
  clearInterval(_timerInt);
  _timerInt=setInterval(function(){
    _timerSecs--;
    updateTimerDisplay(Math.max(0,_timerSecs));
    if(_timerSecs<=0){
      clearInterval(_timerInt);
      // Fade out
      if(_audioCtx&&_masterGain){
        _masterGain.gain.setValueAtTime(_masterGain.gain.value,_audioCtx.currentTime);
        _masterGain.gain.linearRampToValueAtTime(0,_audioCtx.currentTime+5);
        setTimeout(function(){_oscs.forEach(function(o){try{o.stop();}catch(e){}});},6000);
      }
      _playing=false;
      document.getElementById('btnPlay').textContent='✓ Concluído';
      document.getElementById('btnPlay').classList.remove('playing');
      var _ma=document.getElementById('mantraAudio');if(_ma)_ma.pause();
      if(_freqAudio){try{_freqAudio.pause();}catch(e){}_freqAudio=null;}
      salvarSessao();
    }
  },1000);
}

function renderGeo(nome){
  var cnv=document.getElementById('geoCanvas');
  if(!cnv){console.warn('geoCanvas not found');return;}
  var file=GEO_IMGS[nome]||'Flor da Vida.png';
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    var wrap=document.getElementById('geoWrap');
    var sz=wrap?wrap.offsetWidth:400;
    cnv.width=sz;cnv.height=sz;
    var off=document.createElement('canvas');
    off.width=img.naturalWidth;off.height=img.naturalHeight;
    var octx=off.getContext('2d');
    octx.drawImage(img,0,0);
    try{
      var d=octx.getImageData(0,0,off.width,off.height);
      var px=d.data;
      for(var i=0;i<px.length;i+=4){
        var br=px[i]*.299+px[i+1]*.587+px[i+2]*.114;
        if(br<20){px[i+3]=0;}
        else if(br<60){px[i+3]=Math.round((br-20)/40*200);}
      }
      octx.putImageData(d,0,0);
    }catch(e){}
    var ctx=cnv.getContext('2d');
    ctx.clearRect(0,0,sz,sz);
    ctx.drawImage(off,0,0,sz,sz);
  };
  img.onerror=function(){
    var sem=file.replace(/[ÁÀÂÃ]/g,'A').replace(/[áàâã]/g,'a')
              .replace(/[ÉÈÊ]/g,'E').replace(/[éèê]/g,'e')
              .replace(/[óòô]/g,'o').replace(/[ÚÙ]/g,'U');
    if(sem!==file){img.onerror=null;img.src='/geometria-sagrada/'+encodeURIComponent(sem);}
  };
  img.src='/geometria-sagrada/'+encodeURIComponent(file);
}

// ── API ──
window._sessao = null;

async function iniciarSessao(){
  var estado=document.getElementById('estado').value.trim();
  if(!estado){alert('Descreva o que está vivendo.');return;}
  document.getElementById('formView').style.display='none';
  document.getElementById('spinner').style.display='block';
  document.getElementById('btnIniciar').disabled=true;
  try{
    var resp=await fetch('/api/frequencias',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'gerar',nome:_user.nome||_user.email,email:_user.email,estado:estado,intencao:document.getElementById('intencao').value.trim()})});
    var data=await resp.json();
    if(!data.success){throw new Error(data.error||'Erro');}
    window._sessao=data;
    document.getElementById('spinner').style.display='none';
    mostrarSessao(data);
  }catch(e){
    document.getElementById('spinner').style.display='none';
    document.getElementById('formView').style.display='block';
    document.getElementById('btnIniciar').disabled=false;
    alert('Erro ao sintonizar: '+e.message);
  }
}

function mostrarSessao(data){

  document.getElementById('freqNome').textContent=data.frequencia_nome;
  document.getElementById('geoNome').textContent=data.geometria;
  renderGeo(data.geometria);
  var sigEl=document.getElementById('geoSignificado');
  if(sigEl) sigEl.textContent=GEO_SIGNIFICADOS[data.geometria]||'';
  // Carregar mantra correspondente
  var mantraFile=MANTRAS[data.geometria];
  var audioEl=document.getElementById('mantraAudio');
  if(audioEl && mantraFile){
    audioEl.src='/musicas-mantras/'+encodeURIComponent(mantraFile);
    audioEl.load();
  }
  _timerSecs=_durMin*60;
  updateTimerDisplay(_timerSecs);
  // Reading
  function fmtParas(t){
    if(!t)return'';
    return '<p>'+t.replace(/\\n\\n/g,'</p><p>').replace(/\\n/g,' ').replace(/\n\n/g,'</p><p>').replace(/\n/g,' ')+'</p>';
  }
  var _re=document.getElementById('readEscolha');if(_re)_re.innerHTML=fmtParas(data.leitura.escolha||'');
  var _rc=document.getElementById('readCura');if(_rc)_rc.innerHTML=fmtParas(data.leitura.cura||'');
  var _ri=document.getElementById('readIntencao');if(_ri)_ri.innerHTML=fmtParas(data.leitura.intencao||'');
  var sv=document.getElementById('sessionView');
  sv.style.display='flex';
}

async function salvarSessao(){
  if(!_user||!window._sessao)return;
  try{
    await fetch('/api/frequencias',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'salvar',email:_user.email,dados:JSON.stringify({
        frequencia_hz:window._sessao.frequencia_hz,frequencia_nome:window._sessao.frequencia_nome,
        geometria:window._sessao.geometria,duracao_min:_durMin,
        leitura:window._sessao.leitura,created_at:new Date().toISOString()
      })})});
  }catch(e){console.warn('[freq] salvar erro:',e.message);}
}

function novaSessao(){
  if(_playing){stopAudio();}clearInterval(_timerInt);_playing=false;
  document.getElementById('sessionView').style.display='none';
  document.getElementById('formView').style.display='block';
  document.getElementById('btnIniciar').disabled=false;
  document.getElementById('btnPlay').textContent='▶ Iniciar';

}
