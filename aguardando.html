<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmando seu pagamento — Portal da Consciência Universal</title>
<style>
  :root {
    --bg-main: #0a0818;
    --bg-card: rgba(18,13,38,.92);
    --border: rgba(147,109,255,.18);
    --gold: #f0c96b;
    --purple: #c4b5fd;
    --radius: 20px;
    --font-body: 'Segoe UI', system-ui, sans-serif;
    --font-display: Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg-main);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    color: #e2d9f3;
    padding: 24px;
    overflow: hidden;
  }

  /* Estrelas de fundo */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 90%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 50%, rgba(255,255,255,.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid rgba(240,201,107,.35);
    border-radius: var(--radius);
    box-shadow:
      0 8px 32px rgba(0,0,0,.6),
      0 0 40px rgba(240,201,107,.2),
      0 0 80px rgba(240,201,107,.1);
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .simbolo {
    font-size: 3rem;
    margin-bottom: 24px;
    animation: girar 4s linear infinite;
    display: inline-block;
  }

  @keyframes girar {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .titulo {
    font-family: var(--font-display);
    font-size: 1.35rem;
    color: var(--gold);
    margin-bottom: 12px;
    letter-spacing: .02em;
  }

  .subtitulo {
    font-size: .9rem;
    color: rgba(196,181,253,.7);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  /* Barra de progresso animada */
  .barra-wrapper {
    background: rgba(147,109,255,.12);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .barra {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--gold));
    border-radius: 99px;
    animation: pulsar 2s ease-in-out infinite;
    width: 60%;
  }

  @keyframes pulsar {
    0%   { width: 20%; opacity: .7; }
    50%  { width: 80%; opacity: 1; }
    100% { width: 20%; opacity: .7; }
  }

  .status-texto {
    font-size: .82rem;
    color: rgba(196,181,253,.5);
    margin-bottom: 20px;
    min-height: 20px;
  }

  /* Estado: aprovado */
  .aprovado { display: none; }
  .aprovado .simbolo-ok { font-size: 3rem; margin-bottom: 16px; }
  .aprovado .msg { font-size: 1.1rem; color: #86efac; margin-bottom: 8px; font-family: var(--font-display); }
  .aprovado .sub { font-size: .85rem; color: rgba(134,239,172,.6); }

  /* Estado: erro */
  .erro { display: none; }
  .erro .msg-erro { font-size: 1rem; color: #fca5a5; margin-bottom: 16px; }
  .btn-voltar {
    background: rgba(147,109,255,.15);
    border: 1px solid rgba(147,109,255,.4);
    color: var(--purple);
    padding: 10px 24px;
    border-radius: 99px;
    font-size: .85rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    margin-top: 8px;
  }
  .btn-voltar:hover { background: rgba(147,109,255,.25); }

  .tentativas {
    font-size: .72rem;
    color: rgba(255,255,255,.15);
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="card">

  <!-- Estado: aguardando -->
  <div id="estado-aguardando">
    <div class="simbolo">✦</div>
    <div class="titulo">Confirmando seu pagamento</div>
    <div class="subtitulo">Aguarde enquanto os Guardiões verificam sua oferta ao cosmos.<br>Isso pode levar alguns instantes.</div>
    <div class="barra-wrapper"><div class="barra"></div></div>
    <div class="status-texto" id="status-texto">Consultando os registros...</div>
    <div class="tentativas" id="tentativas"></div>
  </div>

  <!-- Estado: aprovado -->
  <div id="estado-aprovado" class="aprovado">
    <div class="simbolo-ok">✅</div>
    <div class="msg">Pagamento confirmado!</div>
    <div class="sub">Redirecionando para sua consulta...</div>
  </div>

  <!-- Estado: erro -->
  <div id="estado-erro" class="erro">
    <div class="msg-erro" id="msg-erro">Não foi possível confirmar o pagamento.</div>
    <a href="/perfil" class="btn-voltar">Voltar ao Perfil</a>
  </div>

</div>

<script>
(function() {
  var params  = new URLSearchParams(window.location.search);
  var ref     = params.get('ref');
  var servico = params.get('servico');

  if (!ref) {
    mostrarErro('Referência de pagamento não encontrada.');
    return;
  }

  // Se voltou do MP sem pagar (status=null ou cancelled na URL)
  var mpStatus = params.get('status') || params.get('collection_status');
  if (mpStatus === 'null' || mpStatus === 'cancelled' || mpStatus === 'rejected') {
    window.location.href = '/perfil';
    return;
  }

  // Mapeamento servico → arquivo html
  var ARQUIVOS = {
    'mapa_akashico': 'mapa-akashico',
    'mapa-akashico': 'mapa-akashico'
  };
  var arquivo = ARQUIVOS[servico] || servico || 'consulta';

  var tentativa = 0;
  var maxTentativas = 60; // 60 × 3s = 3 minutos
  var intervalo;

  function verificar() {
    tentativa++;
    document.getElementById('tentativas').textContent = 'Verificação ' + tentativa + ' de ' + maxTentativas;

    var msgs = [
      'Consultando os Registros Akáshicos...',
      'Aguardando confirmação do cosmos...',
      'Verificando junto aos Guardiões...',
      'Quase lá, os registros estão se alinhando...',
      'Confirmando sua intenção sagrada...'
    ];
    document.getElementById('status-texto').textContent = msgs[tentativa % msgs.length];

    fetch('/api/verificar-pagamento?ref=' + encodeURIComponent(ref))
      .then(function(r) { return r.json(); })
      .then(function(dados) {
        if (dados.status === 'approved') {
          clearInterval(intervalo);
          mostrarAprovado(arquivo);
        } else if (dados.status === 'rejected' || dados.status === 'cancelled') {
          clearInterval(intervalo);
          mostrarErro('Pagamento não aprovado. Tente novamente.');
        } else if (tentativa >= maxTentativas) {
          clearInterval(intervalo);
          mostrarErro('Tempo esgotado. Se o pagamento foi realizado, você receberá acesso em breve. Volte ao perfil e tente acessar o serviço.');
        }
        // status pending/in_process → continua aguardando
      })
      .catch(function() {
        // Erro de rede — continua tentando
      });
  }

  function mostrarAprovado(arquivo) {
    document.getElementById('estado-aguardando').style.display = 'none';
    document.getElementById('estado-aprovado').style.display = 'block';
    setTimeout(function() {
      window.location.href = '/' + arquivo + '.html?pagamento=sucesso';
    }, 2000);
  }

  function mostrarErro(msg) {
    document.getElementById('estado-aguardando').style.display = 'none';
    document.getElementById('estado-erro').style.display = 'block';
    document.getElementById('msg-erro').textContent = msg;
  }

  // Primeira verificação imediata, depois a cada 3 segundos
  verificar();
  intervalo = setInterval(verificar, 3000);
})();
</script>

</body>
</html>
